[project]
name = "sidekick"
version = "0.1.0"
description = "A personal co-worker agent: LangChain worker + evaluator loop, browser and filesystem MCP tools, FastAPI backend and React frontend."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.3",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.33",
    "requests>=2.33.1",
    "sentence-transformers>=6.3.0",
    "uvicorn>=0.54.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
