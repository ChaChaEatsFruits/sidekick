[project]
name = "sidekick"
version = "0.1.0"
description = "A personal co-worker agent: LangChain worker + evaluator loop, browser and filesystem MCP tools, Gradio UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.4",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "wikipedia>=1.4.0",
]
