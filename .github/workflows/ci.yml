name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # the tests embed the knowledge base with all-MiniLM-L6-v2; cache the model download between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uvx ruff@0.14.0 check .
      - name: Test
        run: uv run --frozen pytest -q
